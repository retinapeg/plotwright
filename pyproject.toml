[project]
name = "plotwright"
version = "0.1.0"
description = "Auditable settings-only scientific figures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "matplotlib>=3.11.2",
    "mcp>=1,<2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "streamlit>=1.66.0",
]

[project.scripts]
plotwright = "plotwright.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "plotwright"
